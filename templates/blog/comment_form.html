{% extends 'base.html' %}

{% block content %}
<div class="titulo-pagina">
    <p class="sobretitulo">Novo comentário</p>
    <h2>{{ post.titulo }}</h2>
</div>

<form method="post" class="caixa formulario">
    {% csrf_token %}
    {{ form.as_div }}

    <div class="acoes">
        <button type="submit" class="botao">Publicar comentário</button>
        <a class="botao botao-secundario" href="{% url 'post_detail' post.pk %}">Cancelar</a>
    </div>
</form>
{% endblock %}
