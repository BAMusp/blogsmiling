{% extends 'base.html' %}

{% block title %}{{ post.titulo }}{% endblock %}

{% block content %}
<article>
    <h2>{{ post.titulo }}</h2>
    <p>Publicado em {{ post.data_postagem|date:"d/m/Y H:i" }}</p>

    {{ post.conteudo|safe }}
</article>

<p>
    <a href="{% url 'post_update' post.pk %}">Editar</a> |
    <a href="{% url 'post_delete' post.pk %}">Remover</a> |
    <a href="{% url 'post_list' %}">Voltar</a>
</p>
{% endblock %}
