{% extends 'base.html' %}

{% block content %}
<h2>Remover post</h2>
<p>Tem certeza de que deseja remover <strong>{{ post.titulo }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Sim, remover</button>
    <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
</form>
{% endblock %}
